name: Build MCPE Client Native Library

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: ndk-samples/setup-ndk-action@v1
      with:
        ndk-version: r25c

    - name: Build C++ Native Library with CMake
      run: |
        mkdir -p app/src/main/cpp/build
        cd app/src/main/cpp/build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Upload Built Library
      uses: actions/upload-artifact@v4
      with:
        name: libclient-arm64
        path: app/src/main/cpp/build/*.so
